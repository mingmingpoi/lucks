<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="入口导航主页">
<title>我的主页</title>

<!--
  ========================================================================
   此主页的维护与发布方式（重要）：
   ----------------------------------------------------------
   线上访客看到的数据来自同目录的 config.json 文件（仓库数据源）。
   您(管理员)更新内容的流程：
   1. 本机打开本文件夹的 index.html（双击即可），进右下角管理后台改内容；
   2. 点「保存并同步」，会自动下载/生成一份最新的 config.json 到本机；
   3. 把这份 config.json 放回本文件夹（覆盖旧的 config.json）；
   4. 双击「同步.bat」→ 自动 git 提交并推送到 Gitee 仓库；
   5. 若用 Gitee Pages，去仓库「服务-Gitee Pages」点一次"更新"触发审核。
   ※ 线上页面自动读取 config.json；本文件顶部 entries 只是"出厂默认值"，
     给首次打开或本地管理时兜底用，平时改它不影响线上。
   ========================================================================
   下方【内容配置区】仅供兜底与备份，一般用后台 + config.json 维护即可。
   格式说明（兜底用，照抄一行改一改）：
   ----------------------------------------------------------
   ① 新增一个入口：在 entries 的 [ 和 ] 之间复制任意一行 { ... } 填好。
   每行格式：
        type     入口类型：填 'link'     → 点击跳转网页(新窗口打开)
                          填 'download' → 点击下载文件
        icon     卡片小图标：填一个 emoji，如 🌐 📄 🎮 🎁 ✨；可留 ''
        title    卡片标题：显示的入口名称
        desc     卡片副标题：一句话描述；可留 ''
        url      链接地址：跳转网页填网址；下载文件填与网页同目录的文件名
        color    卡片配色（可不填）：candy / sunset / ocean / grape /
                 mint / gold 六选一；不填自动轮换
        cat      分类（可不填）：填 categories 里的名字，多个用英文逗号分隔
   ② 每两个入口之间用英文逗号 , 分隔；最后一个后面不要逗号。
  ========================================================================
-->
<style>
  :root{
    --bg1:#fff0f6; --bg2:#f0f0ff; --bg3:#e6f7ff;
    --ink:#2b2140; --ink2:#6f6487;
    --card:rgba(255,255,255,.86);
    --line:rgba(120,90,200,.10);
    --shadow:0 8px 24px rgba(120,90,200,.10);
    --shadow-hover:0 16px 34px rgba(120,90,200,.18);
    --r-lg:22px; --r-md:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* —— 漂浮彩球背景 —— */
  .blob{position:fixed; z-index:0; border-radius:50%; filter:blur(60px); opacity:.55; pointer-events:none;}
  .blob.b1{width:340px;height:340px; left:-80px;  top:-80px;  background:#ffd3e8; animation:float 14s ease-in-out infinite;}
  .blob.b2{width:300px;height:300px; right:-70px; top:12%;    background:#d9c7ff; animation:float 17s ease-in-out infinite reverse;}
  .blob.b3{width:360px;height:360px; left:22%;    bottom:-130px; background:#c9ecff; animation:float 20s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-30px) scale(1.08)}}

  .wrap{position:relative; z-index:1; width:min(1040px, calc(100% - 32px)); margin:0 auto; padding:64px 0 48px;}
  @media (max-width:640px){ .wrap{padding:44px 0 32px;} }

  /* —— 顶部标题区 —— */
  header{text-align:center; margin-bottom:34px;}
  .site-name{
    margin:0; font-size:clamp(30px, 5vw, 44px); font-weight:900; letter-spacing:.5px;
    background:linear-gradient(90deg,#ff5e8a,#8a5cff 60%,#2f9bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:rise .55s .08s ease both;
  }
  .slogan{margin:12px 0 0; color:var(--ink2); font-size:clamp(15px,2.4vw,17px); animation:rise .55s .16s ease both;}

  /* —— 卡片墙 —— */
  .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(258px,1fr));}
  @media (max-width:600px){ .grid{gap:12px;} }

  .card{
    position:relative; display:flex; align-items:center; gap:14px; padding:16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    box-shadow:var(--shadow); text-decoration:none; color:inherit;
    backdrop-filter:blur(8px); overflow:hidden;
    animation:rise .5s both; animation-delay:calc(var(--i,0)*45ms);
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card::before{ /* 顶部渐变色条 */
    content:""; position:absolute; left:0; top:0; right:0; height:4px;
    background:linear-gradient(90deg,var(--a,#ff6a88),var(--b,#b06ff0));
    opacity:.85;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px); box-shadow:var(--shadow-hover);
    border-color:rgba(140,110,255,.35); outline:none;
  }
  .card:active{transform:translateY(-1px) scale(.995);}

  .icon{
    flex:0 0 auto; width:52px; height:52px; border-radius:15px; display:grid;
    place-items:center; font-size:26px; color:#fff; background:linear-gradient(135deg,var(--a),var(--b));
    box-shadow:0 6px 14px rgba(0,0,0,.10); user-select:none;
  }
  .info{min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; padding-right:6px;}
  .name{font-size:16px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .desc{font-size:13px; color:var(--ink2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tag{
    flex:0 0 auto; font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px;
  }
  .tag.go{color:#2f6fed; background:rgba(47,111,237,.12);}
  .tag.dl{color:#e06a22; background:rgba(224,106,34,.13);}

  /* —— 卡片六套配色 —— */
  .th-candy  {--a:#fda085; --b:#f5576c;}
  .th-sunset {--a:#ff9a8b; --b:#ff6a88;}
  .th-ocean  {--a:#36d1dc; --b:#5b86e5;}
  .th-grape  {--a:#a18cd1; --b:#fbc2eb;}
  .th-mint   {--a:#43e97b; --b:#38c8a8;}
  .th-gold   {--a:#f6d365; --b:#fda085;}

  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important;}
  }

  /* —— 底部 —— */
  footer{margin-top:40px; text-align:center; color:var(--ink2); font-size:12.5px; animation:rise .5s .3s ease both;}
  @media (max-width:600px){ footer{margin-top:28px;} }

  /* —— 首页：搜索 + 分类标签 —— */
  .home-tools{margin:-6px 0 22px;}
  .search-box{position:relative; max-width:520px; margin:0 auto 14px;}
  .search-box .search-ico{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; pointer-events:none;}
  .search-box input{width:100%; padding:12px 16px 12px 42px; border:1px solid var(--line);
    border-radius:999px; font-size:14.5px; outline:none; box-sizing:border-box;
    background:var(--card); backdrop-filter:blur(8px); box-shadow:var(--shadow); color:var(--ink);}
  .search-box input:focus{border-color:rgba(150,110,255,.5);}
  .cats{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-btn{flex:0 0 auto; border:1px solid var(--line); cursor:pointer; padding:8px 16px;
    border-radius:12px; font-size:14px; font-weight:600; color:var(--ink2);
    background:var(--card); backdrop-filter:blur(8px); box-shadow:0 4px 12px rgba(120,90,200,.08);
    transition:transform .15s ease, box-shadow .15s ease;}
  .cat-btn:hover{transform:translateY(-2px);}
  .cat-btn.active{color:#fff; border-color:transparent;
    background:linear-gradient(135deg,#ff8a3d,#ff6a6a);
    box-shadow:0 8px 18px rgba(255,120,80,.35);}
  .cat-btn .cnt{font-size:11px; font-weight:500; opacity:.75; margin-left:3px;}

  /* —— 卡片：收藏星标 + 分类小字 —— */
  .side{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:7px;}
  .star{width:30px; height:30px; border:none; border-radius:50%; cursor:pointer; font-size:16px;
    line-height:1; background:rgba(120,90,200,.07); color:#b9b0d0;
    display:grid; place-items:center; transition:transform .15s ease, background .15s ease;}
  .star:hover{transform:scale(1.12); background:rgba(255,180,60,.18);}
  .star.on{color:#ffb02e; background:rgba(255,180,60,.16);}
  .cat-labels{font-size:11px; color:#a49bbd; margin-top:3px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .empty-tip{grid-column:1/-1; text-align:center; color:var(--ink2); font-size:14px; padding:30px 0;}
</style>
<style>
  /* ================= 管理后台(齿轮按钮/口令/抽屉) ================= */
  .gear{position:fixed; right:20px; bottom:20px; z-index:60; width:50px; height:50px;
        border:none; border-radius:50%; cursor:pointer; color:#fff; font-size:22px;
        display:grid; place-items:center; background:linear-gradient(135deg,#ff6a88,#8a5cff);
        box-shadow:0 10px 22px rgba(150,90,255,.35); transition:transform .25s ease;}
  .gear:hover{transform:rotate(60deg) scale(1.06);}
  .gear.off{display:none;}

  .pw-mask{position:fixed; inset:0; z-index:75; display:none; align-items:center;
           justify-content:center; background:rgba(25,15,50,.45);}
  .pw-card{width:min(330px,88vw); background:#fff; border-radius:18px; padding:22px;
           box-shadow:0 20px 60px rgba(0,0,0,.25); text-align:center;}
  .pw-card h3{margin:0 0 6px; font-size:17px;}
  .pw-card p{margin:0 0 14px; color:#8a819f; font-size:12.5px;}
  .pw-card input{width:100%; padding:10px 12px; border:1px solid #e2dcf0;
                 border-radius:10px; font-size:15px; outline:none; box-sizing:border-box;}
  .pw-err{color:#e5484d; font-size:12.5px; min-height:18px; margin-top:6px;}
  .pw-btns{display:flex; gap:10px; margin-top:8px;}
  .pw-btns button{flex:1; padding:9px 0; border:none; border-radius:10px; cursor:pointer;
                  font-size:14px; font-weight:600;}
  .pw-go{background:linear-gradient(135deg,#ff6a88,#8a5cff); color:#fff;}
  .pw-cancel{background:#f1eef8; color:#5b5470;}

  .adm-wrap{position:fixed; inset:0; z-index:65; display:none; pointer-events:none;}
  .adm-wrap.on{display:block;}
  .adm{pointer-events:auto; position:absolute; top:0; right:0; height:100%;
       width:min(720px,96vw); background:#fff; overflow:hidden; padding:18px 18px 0;
       box-shadow:-10px 0 40px rgba(60,30,110,.16); box-sizing:border-box;
       display:flex; flex-direction:column; animation:slideIn .22s ease;}
  .adm-head,.adm-tip,.adm-sec,.adm-row,.adm-btns{flex:0 0 auto;}
  #fEntries{flex:1 1 auto; min-height:140px; overflow-y:auto; overflow-x:hidden;
            padding:2px 8px 10px 0; margin-top:2px;}
  #fEntries::-webkit-scrollbar{width:8px;}
  #fEntries::-webkit-scrollbar-thumb{background:#e3daf5; border-radius:8px;}
  #fEntries::-webkit-scrollbar-thumb:hover{background:#cbbcf0;}
  #fEntries::-webkit-scrollbar-track{background:transparent;}
  @keyframes slideIn{from{transform:translateX(36px); opacity:0;} to{transform:none; opacity:1;}}
  .adm-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .adm-head b{font-size:18px;}
  .adm-x{border:none; background:#f1eef8; color:#6a6286; width:32px; height:32px;
         border-radius:10px; cursor:pointer; font-size:14px;}
  .adm-tip{color:#8a819f; font-size:12.5px; line-height:1.6; margin:0 0 14px;
           background:#faf8ff; border:1px dashed #e3daf5; padding:8px 12px; border-radius:10px;}
  .adm-sec{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
           color:#6a4fd8; margin:18px 0 8px;}
  .adm-sec::after{content:""; flex:1; height:1px; background:#efeafc;}
  .adm-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .adm-row label{flex:0 0 66px; font-size:13px; color:#555; font-weight:600;}
  .adm-row input{flex:1; min-width:0; padding:8px 10px; border:1px solid #e2dcf0;
                 border-radius:9px; font-size:14px; outline:none; box-sizing:border-box;}
  .adm-row input:focus{border-color:#a78bfa;}

  .ent{background:#faf9fd; border:1px solid #efe9fb; border-radius:12px; padding:10px; margin-bottom:10px;}
  .ent-l1{display:flex; align-items:center; gap:8px;}
  .ent-no{flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:#efe8ff;
          color:#7c5cff; font-size:11px; font-weight:700; display:grid; place-items:center;}
  .ent input,.ent select{border:1px solid #e6def4; border-radius:8px; padding:7px 8px;
                         font-size:13.5px; outline:none; background:#fff; color:#333;}
  .ent input:focus,.ent select:focus{border-color:#a78bfa;}
  .e-icon{flex:0 0 56px; height:34px; text-align:center; box-sizing:border-box;
          cursor:pointer; font-size:19px; line-height:1; padding:0;
          background:#fff; border:1px solid #e6def4; border-radius:8px;}
  .e-title{flex:1 1 90px; min-width:60px;}
  .e-type{flex:0 0 76px;}
  .e-color{flex:0 0 112px;}
  .ent-ops{display:flex; gap:4px;}
  .ent-ops button{width:28px; height:28px; border:none; border-radius:8px; background:#f1ecfc;
                  color:#6b5bb5; cursor:pointer; font-size:13px; flex:0 0 auto;}
  .ent-ops button.del{background:#ffeceb; color:#e5484d;}
  .ent-ops button:hover{filter:brightness(.96);}
  .ent-l2{display:flex; gap:8px; margin-top:8px;}
  .e-url{flex:1.4; min-width:0;}
  .e-desc{flex:1; min-width:0;}
  .e-cat{flex:1 1 100%; min-width:0;}

  .icon-pop{position:fixed; z-index:90; width:272px; background:#fff; border-radius:14px;
            box-shadow:0 18px 50px rgba(60,30,110,.28); padding:10px; display:none;}
  .icon-pop.show{display:block;}
  .icon-pop::before{content:""; position:absolute; left:22px; top:-7px; width:14px; height:14px;
            background:#fff; transform:rotate(45deg);}
  .ip-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-height:190px; overflow-y:auto;}
  .ip-grid button{border:none; background:#faf9fd; border-radius:9px; height:38px; font-size:19px;
            cursor:pointer; line-height:1;}
  .ip-grid button:hover{background:#f1eaff;}
  .ip-cus{display:flex; gap:6px; margin-bottom:8px;}
  .ip-cus input{flex:1; min-width:0; border:1px solid #e6def4; border-radius:8px; padding:6px 8px;
            font-size:13px; outline:none;}
  .ip-clear{width:100%; margin-top:8px; border:1px dashed #e6def4; background:#fff; border-radius:8px;
            padding:6px 0; font-size:12.5px; color:#8a819f; cursor:pointer;}

  .adm-row button{flex:0 0 auto; border:none; background:#f1eef8; color:#6a6286;
            border-radius:9px; padding:0 11px; font-size:12.5px; cursor:pointer; height:34px;}

  .adm-search{position:relative; margin:4px 0 10px; flex:0 0 auto;}
  .adm-search input{width:100%; padding:9px 12px; border:1px solid #e6def4; border-radius:10px;
            font-size:13.5px; outline:none; box-sizing:border-box; background:#faf9fd;}
  .adm-search input:focus{border-color:#a78bfa; background:#fff;}
  .adm-search #fCount{position:absolute; right:12px; top:50%; transform:translateY(-50%);
            font-size:12px; color:#b3a8cf; pointer-events:none;}

  .adm-btns{display:flex; flex-wrap:wrap; gap:8px; padding:12px 0 18px;
            background:#fff; border-top:1px solid #f1ecfb;}
  .adm-btns button{border:none; border-radius:10px; padding:10px 15px; font-size:13.5px;
                   cursor:pointer; font-weight:600;}
  #bAdd{background:#fff0f3; color:#e5484d;}
  #bSave{background:linear-gradient(135deg,#43e97b,#38c8a8); color:#fff;}
  #bReset{background:#f1eef8; color:#5b5470;}
  #bExport,#bImport{background:#e8f2ff; color:#2563eb;}

  .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:85;
         background:#2b2140; color:#fff; padding:9px 16px; border-radius:999px;
         font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}

  @media (max-width:600px){
    .gear{right:12px; bottom:12px; width:46px; height:46px;}
    .adm{width:100vw; box-shadow:none;}
    .ent-l1{flex-wrap:wrap;}
    .e-color{flex:1 1 100%;}
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- ======================= 内容配置区：改这里即可 ======================= -->
  <script>
    const SITE_CONFIG = {
      siteName : "lucks",            // 顶部大标题
      slogan   : "收集我常用的网站和文件，点卡片直达", // 顶部副标题
      adminPass: "admin888",         // 管理后台口令(进后台用，也可在后台里改)
      footer   : "",                   // 底部小字，不需要就留 ''
      categories: ["实用","学习","工具","艺术","生活","娱乐","视频","音乐","图片","游戏"], // 首页分类标签(可自己增删)
      entries  : [
        // ▼ 从这里复制一行，往下加，入口都在卡片上显示 ▼
        // cat 是分类：填上面 categories 里的名字，多个用英文逗号分隔，如 "实用,音乐"；不需要可留 ''
        { type:"link",     icon:"🌐", title:"示例网站", desc:"跳转网页示例：点开新窗口", url:"https://www.example.com",        color:"",     cat:"工具,实用" },
        { type:"download", icon:"📄", title:"示例文件", desc:"下载文件示例：文件与网页放同一目录", url:"示例文件.pdf",              color:"mint", cat:"学习"     },
        { type:"link",     icon:"🎨", title:"配色自定义", desc:"color 可从 candy/sunset/ocean/grape/mint/gold 中选", url:"https://www.example.com", color:"candy", cat:"艺术,图片" },
        // ▲ 复制上面任意一行，改内容即可新增入口 ▲
      ],
    };
  </script>
  <!-- ==================== 内容配置区结束（下面不用动） ==================== -->

  <main class="wrap">
    <header>
      <h1 class="site-name" id="siteName">lucks</h1>
      <p class="slogan" id="slogan"></p>
    </header>
    <div class="home-tools">
      <div class="search-box">
        <span class="search-ico">🔍</span>
        <input id="homeSearch" type="search" placeholder="搜索关键词：标题 / 描述 / 链接" autocomplete="off">
      </div>
      <nav class="cats" id="cats" aria-label="分类"></nav>
    </div>
    <div class="grid" id="cards"></div>
    <footer id="footer"></footer>
  </main>

  <script>
    (function () {
      /* ================== 数据：默认配置 + 本机缓存(缓存优先) ================== */
      var LS_KEY = "lucks_home_cfg_v1";

      /* 管理模式判断：
         file:// 双击打开 或 地址加 ?edit=1 → 编辑模式(显示齿轮后台，改本地数据)
         其它(线上 / http 直开)         → 展示模式：优先读取同目录 config.json */
      var EDIT_MODE = (location.protocol === "file:") || /[?&]edit=1(\b|&|$)/.test(location.search);

      function norm(e) {
        e = e || {};
        return {
          type:  (e.type === "download") ? "download" : "link",
          icon:  (typeof e.icon  === "string") ? e.icon  : "",
          title: (typeof e.title === "string") ? e.title : "",
          desc:  (typeof e.desc  === "string") ? e.desc  : "",
          url:   (typeof e.url   === "string") ? e.url   : "",
          color: (typeof e.color === "string") ? e.color : "",
          cat:   (typeof e.cat   === "string") ? e.cat   : ""
        };
      }
      function readSaved() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) { var o = JSON.parse(raw); if (o && typeof o === "object") return o; }
        } catch (err) {}
        return null;
      }
      var saved = EDIT_MODE ? readSaved() : null;

      function defaults() {
        var d = (typeof SITE_CONFIG !== "undefined") ? SITE_CONFIG : {};

                  siteName:   (typeof o.siteName  === "string") ? o.siteName  : cur.siteName,
                  slogan:     (typeof o.slogan    === "string") ? o.slogan    : cur.slogan,
                  footer:     (typeof o.footer    === "string") ? o.footer    : cur.footer,
                  adminPass:  (typeof o.adminPass === "string" && o.adminPass !== "") ? o.adminPass : cur.adminPass,
                  categories: Array.isArray(o.categories) ? o.categories.filter(function (c) { return typeof c === "string" && c.trim(); }) : cur.categories,
                  entries:    Array.isArray(o.entries) ? o.entries.map(norm) : cur.entries
                };
                render();
                return;

      fEntries.addEventListener("input", function (ev) {
        var t = ev.target;
        if (!t || !t.dataset || !t.dataset.k) return;
        var row = t.closest(".ent");
        if (!row) return;
        cur.entries[+row.dataset.idx][t.dataset.k] = t.value;
        render();
      });
      fEntries.addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.dataset || !t.dataset.k) return;
        var row = t.closest(".ent");
        if (!row) return;
        cur.entries[+row.dataset.idx][t.dataset.k] = t.value;
        render();
      });
      fEntries.addEventListener("click", function (ev) {
        var rowEl = ev.target.closest ? ev.target.closest(".ent") : null;
        if (!rowEl) return;
        var i = +rowEl.dataset.idx;
        var opBtn = ev.target.closest ? ev.target.closest("button[data-op]") : null;
        if (opBtn) {
          if (opBtn.dataset.op === "up" && i > 0) {
            var t = cur.entries[i]; cur.entries[i] = cur.entries[i - 1]; cur.entries[i - 1] = t;
          } else if (opBtn.dataset.op === "down" && i < cur.entries.length - 1) {
            var u = cur.entries[i]; cur.entries[i] = cur.entries[i + 1]; cur.entries[i + 1] = u;
          } else if (opBtn.dataset.op === "del") {
            cur.entries.splice(i, 1);
          } else { return; }
          buildList(); render();
          return;
        }
        if (ev.target.classList && ev.target.classList.contains("e-icon")) {
          openPick(ev.target, i);
        }
      });

      $id("bAdd").addEventListener("click", function () {
        if (searchKw) { searchKw = ""; if (fSearchEl) fSearchEl.value = ""; } // 有搜索时先清空，保证新行可见
        cur.entries.push(norm(null));
        buildList(); render();
        var rows = fEntries.querySelectorAll(".ent");
        if (rows.length) {
          rows[rows.length - 1].querySelector(".e-title").focus();
          fEntries.scrollTop = fEntries.scrollHeight; // 滚到最底部，让新行可见
        }
      });
      $id("bSave").addEventListener("click", saveNow);
      $id("bReset").addEventListener("click", function () {
        if (!confirm("恢复默认会清空本机缓存并回到 index.html 中的默认值，确定继续？")) return;
        try { localStorage.removeItem(LS_KEY); } catch (e) {}
        saved = null; cur = defaults();
        fillForm(); render();
        toast("已恢复默认并清空本机缓存");
      });
      $id("bExport").addEventListener("click", function () {
        collect();
        downloadFile("主页配置.json", JSON.stringify(buildConfigData(), null, 2),
                     "application/json;charset=utf-8");
        toast("已导出配置文件(主页配置.json)");
      });
      $id("bImport").addEventListener("click", function () { $id("fFile").click(); });
      $id("fFile").addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var o = JSON.parse(reader.result);
            var arr = Array.isArray(o) ? o : (o && Array.isArray(o.entries) ? o.entries : null);
            if (!arr) { alert("导入文件格式不对：需包含 entries 数组"); return; }
            if (o && typeof o === "object" && !Array.isArray(o)) {
              if (typeof o.siteName === "string") cur.siteName = o.siteName;
              if (typeof o.slogan === "string")   cur.slogan   = o.slogan;
              if (typeof o.footer === "string")   cur.footer   = o.footer;
              if (typeof o.adminPass === "string" && o.adminPass !== "") cur.adminPass = o.adminPass;
            }
            cur.entries = arr.map(norm);
            saved = null;
            fillForm(); render();
            toast("已导入，点「保存到本机」才会写入本浏览器缓存");
          } catch (e) { alert("导入失败：" + e.message); }
        };
        reader.readAsText(file);
        this.value = "";
      });

      /* ---- 口令 + 打开/关闭 ---- */
      function openPass() {
        pwMask.style.display = "flex";
        $id("pwErr").textContent = "";
        $id("pwIn").value = "";
        setTimeout(function () { $id("pwIn").focus(); }, 30);
      }
      function closePw() { pwMask.style.display = "none"; }
      function openAdm() {
        admWrap.classList.add("on"); gear.classList.add("off");
        searchKw = ""; if (fSearchEl) fSearchEl.value = ""; // 重进后台时重置搜索
        fillForm();
      }
      function closeAdm() { admWrap.classList.remove("on"); gear.classList.remove("off"); }

      gear.addEventListener("click", function () {
        if (admWrap.classList.contains("on")) closeAdm(); else openPass();
      });
      $id("pwOk").addEventListener("click", function () {
        if ($id("pwIn").value === cur.adminPass) { closePw(); openAdm(); }
        else $id("pwErr").textContent = "口令不对，请重试（默认 admin888）";
      });
      $id("pwIn").addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") $id("pwOk").click();
      });
      $id("pwNo").addEventListener("click", closePw);
      pwMask.addEventListener("click", function (ev) { if (ev.target === pwMask) closePw(); });
      $id("admX").addEventListener("click", closeAdm);
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") { closePop(); closePw(); closeAdm(); }
      });

      /* 展示模式：读取同目录 config.json 作为线上数据源 */
      loadRemote();
    })();
  </script>
</body>
</html>
