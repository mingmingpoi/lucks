<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="入口导航主页">
<title>我的主页</title>
<style>
  :root{
    --bg1:#fff0f6; --bg2:#f0f0ff; --bg3:#e6f7ff;
    --ink:#2b2140; --ink2:#6f6487;
    --card:rgba(255,255,255,.86);
    --line:rgba(120,90,200,.10);
    --shadow:0 8px 24px rgba(120,90,200,.10);
    --shadow-hover:0 16px 34px rgba(120,90,200,.18);
    --r-lg:22px; --r-md:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* —— 漂浮彩球背景 —— */
  .blob{position:fixed; z-index:0; border-radius:50%; filter:blur(80px); opacity:.7; pointer-events:none; mix-blend-mode:saturation;}
  .blob.b1{width:420px;height:420px; left:-120px; top:-120px; background:radial-gradient(circle,#ffb3d1 0%,transparent 70%); animation:float 14s ease-in-out infinite;}
  .blob.b2{width:380px;height:380px; right:-100px; top:10%; background:radial-gradient(circle,#c4a8ff 0%,transparent 70%); animation:float 17s ease-in-out infinite reverse;}
  .blob.b3{width:460px;height:460px; left:28%; bottom:-160px; background:radial-gradient(circle,#a5d9ff 0%,transparent 70%); animation:float 20s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.1)}}

  .wrap{position:relative; z-index:1; width:min(1040px, calc(100% - 32px)); margin:0 auto; padding:64px 0 48px;}
  @media (max-width:640px){ .wrap{padding:44px 0 32px;} }

  /* —— 顶部标题区 —— */
  header{text-align:center; margin-bottom:34px;}
  .site-name{
    margin:0; font-size:clamp(32px, 5.5vw, 52px); font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,#ff5e8a,#8a5cff 60%,#2f9bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 6px rgba(138,92,255,.28));
    animation:rise .55s .08s ease both;
  }
  .slogan{margin:14px 0 0; color:var(--ink2); font-size:clamp(15px,2.4vw,17px); animation:rise .55s .16s ease both; letter-spacing:.4px;}

  /* —— 卡片墙 —— */
  .grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));}
  @media (max-width:600px){ .grid{gap:14px;} }

  .card{
    position:relative; display:flex; align-items:center; gap:14px; padding:18px 18px 18px 16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    box-shadow:var(--shadow); text-decoration:none; color:inherit;
    backdrop-filter:blur(14px); overflow:hidden;
    animation:rise .5s both; animation-delay:calc(var(--i,0)*45ms);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, border-color .25s ease;
  }
  .card::before{ /* 顶部渐变光晕条 */
    content:""; position:absolute; left:0; top:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--a,#ff6a88),var(--b,#b06ff0));
    opacity:.95;
  }
  .card::after{ /* 悬停光晕层，默认隐藏 */
    content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(400px 120px at 50% -10%, rgba(138,92,255,.18), transparent 60%);
    opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-5px); box-shadow:0 22px 48px rgba(120,90,200,.22);
    border-color:rgba(140,110,255,.4); outline:none;
  }
  .card:hover::after{opacity:1;}
  .card:active{transform:translateY(-1px) scale(.995);}

  .icon{
    flex:0 0 auto; width:54px; height:54px; border-radius:16px; display:grid;
    place-items:center; font-size:26px; color:#fff; position:relative;
    background:linear-gradient(135deg,var(--a),var(--b));
    box-shadow:0 8px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25); user-select:none;
  }
  .icon::after{content:""; position:absolute; inset:-4px; border-radius:20px;
    background:linear-gradient(135deg,var(--a),var(--b)); opacity:.25; filter:blur(10px); z-index:-1;}
  .info{min-width:0; flex:1; display:flex; flex-direction:column; gap:4px; padding-right:4px;}
  .name{font-size:16px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.2px;}
  .desc{font-size:13px; color:var(--ink2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tag{
    flex:0 0 auto; font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
    letter-spacing:.3px;
  }
  .tag.go{color:#2f6fed; background:rgba(47,111,237,.12);}
  .tag.dl{color:#e06a22; background:rgba(224,106,34,.13);}

  /* —— 卡片六套配色 —— */
  .th-candy  {--a:#fda085; --b:#f5576c;}
  .th-sunset {--a:#ff9a8b; --b:#ff6a88;}
  .th-ocean  {--a:#36d1dc; --b:#5b86e5;}
  .th-grape  {--a:#a18cd1; --b:#fbc2eb;}
  .th-mint   {--a:#43e97b; --b:#38c8a8;}
  .th-gold   {--a:#f6d365; --b:#fda085;}

  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important;}
  }

  /* —— 底部 —— */
  footer{margin-top:40px; text-align:center; color:var(--ink2); font-size:12.5px; animation:rise .5s .3s ease both;}
  @media (max-width:600px){ footer{margin-top:28px;} }

  /* —— 首页：搜索 + 分类标签 —— */
  .home-tools{margin:-8px 0 22px;}
  .search-box{position:relative; max-width:540px; margin:0 auto 14px;}
  .search-box .search-ico{position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; pointer-events:none; z-index:1;}
  .search-box input{width:100%; padding:14px 16px 14px 44px; border:1px solid var(--line);
    border-radius:999px; font-size:15px; outline:none; box-sizing:border-box; letter-spacing:.3px;
    background:var(--card); backdrop-filter:blur(14px); box-shadow:var(--shadow); color:var(--ink);
    transition:border-color .2s ease, box-shadow .25s ease, transform .15s ease;}
  .search-box input:focus{border-color:rgba(150,110,255,.55); box-shadow:0 12px 30px rgba(120,90,200,.18); transform:translateY(-1px);}
  .cats{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-btn{flex:0 0 auto; border:1px solid var(--line); cursor:pointer; padding:8px 15px;
    border-radius:12px; font-size:13.5px; font-weight:600; color:var(--ink2); letter-spacing:.2px;
    background:var(--card); backdrop-filter:blur(10px); box-shadow:0 4px 14px rgba(120,90,200,.08);
    transition:transform .18s ease, box-shadow .18s ease, color .18s ease;}
  .cat-btn:hover{transform:translateY(-2px); color:var(--ink); box-shadow:0 8px 20px rgba(120,90,200,.15);}
  .cat-btn.active{color:#fff; border-color:transparent;
    background:linear-gradient(135deg,#ff8a3d,#ff6a6a);
    box-shadow:0 10px 22px rgba(255,120,80,.4); transform:translateY(-2px);}
  .cat-btn .cnt{font-size:10.5px; font-weight:500; opacity:.75; margin-left:3px;}

  /* —— 卡片：收藏星标 + 分类小字 —— */
  .side{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .star{width:32px; height:32px; border:none; border-radius:50%; cursor:pointer; font-size:16px;
    line-height:1; background:var(--chip); color:var(--muted);
    display:grid; place-items:center; transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .star:hover{transform:scale(1.15) rotate(15deg); background:rgba(255,180,60,.18); box-shadow:0 4px 12px rgba(255,180,60,.2);}
  .star.on{color:#fff; background:linear-gradient(135deg,#ffc43a,#ff8a3d); box-shadow:0 6px 14px rgba(255,160,50,.4);}
  .cat-labels{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .empty-tip{grid-column:1/-1; text-align:center; color:var(--ink2); font-size:14px; padding:30px 0;}

  /* ================= 扩展：深色主题 ================= */
  :root{
    --muted:#a49bbd; --chip:rgba(255,255,255,.72);
    --field-bg:#fff; --field-ink:#3a2f52; --field-line:#e6def4;
  }
  html[data-theme="dark"]{
    --bg1:#131028; --bg2:#181233; --bg3:#0e1730;
    --ink:#ece7fb; --ink2:#bcb2d8; --muted:#948cae;
    --card:rgba(47,39,76,.92);
    --line:rgba(170,150,255,.16);
    --shadow:0 8px 24px rgba(0,0,0,.4);
    --shadow-hover:0 16px 34px rgba(0,0,0,.55);
    --chip:rgba(72,60,124,.55);
    --field-bg:#2b2447; --field-ink:#e8e2f8; --field-line:#443a6e;
  }
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]){
      --bg1:#131028; --bg2:#181233; --bg3:#0e1730;
      --ink:#ece7fb; --ink2:#bcb2d8; --muted:#948cae;
      --card:rgba(47,39,76,.92);
      --line:rgba(170,150,255,.16);
      --shadow:0 8px 24px rgba(0,0,0,.4);
      --shadow-hover:0 16px 34px rgba(0,0,0,.55);
      --chip:rgba(72,60,124,.55);
      --field-bg:#2b2447; --field-ink:#e8e2f8; --field-line:#443a6e;
    }
  }
  html[data-theme="dark"] .blob{opacity:.3;}
  @media (prefers-color-scheme:dark){ html:not([data-theme="light"]) .blob{opacity:.3;} }

  .cat-labels{color:var(--muted);}      /* 与上面定义合并覆盖，保持深浅自适应 */
  .star{background:var(--chip); color:var(--muted);}

  /* ================= 扩展：顶栏(问候+时钟) ================= */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;
          padding:10px 16px; background:var(--card); border:1px solid var(--line);
          border-radius:14px; backdrop-filter:blur(10px); box-shadow:var(--shadow);
          animation:rise .5s ease both;}
  .tb-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .greet{font-size:12px; color:var(--ink2); letter-spacing:.6px; line-height:1;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .greet b{color:var(--ink); font-weight:600;}
  .clock{font-size:clamp(20px,3.8vw,28px); font-weight:800; line-height:1.05; letter-spacing:.5px;
         font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; white-space:nowrap;
         padding:4px 12px; border-radius:10px;
         background:linear-gradient(90deg,#ff5e8a,#8a5cff 70%,#2f9bff);
         -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
         filter:drop-shadow(0 1px 3px rgba(138,92,255,.25));
         animation:rise .5s ease both;}
  .tb-right{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .tb-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink2);
           background:var(--chip); border:1px solid var(--line); border-radius:999px;
           padding:6px 12px; cursor:pointer; backdrop-filter:blur(8px); user-select:none;
           transition:transform .15s ease, box-shadow .15s ease;}
  .tb-chip:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .tb-chip b{color:var(--ink);}
  #themeBtn{border:1px solid var(--line); background:var(--chip); color:var(--ink);
            width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;
            display:grid; place-items:center; transition:transform .2s ease, box-shadow .15s ease;}
  #themeBtn:hover{transform:rotate(180deg); box-shadow:var(--shadow);}
  .qline{font-size:12.5px; color:var(--muted); margin:11px 0 0; font-style:italic; cursor:pointer;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; animation:rise .5s .2s ease both;}
  .qline:hover{color:var(--ink2);}
  @media (max-width:600px){
    .topbar{margin-bottom:14px; padding:8px 12px; border-radius:12px;}
    .greet{font-size:10.5px; letter-spacing:.4px;}
    .clock{font-size:20px; letter-spacing:.2px; padding:3px 8px; border-radius:8px;}
    .tb-left{gap:8px;}
    #themeBtn{width:30px; height:30px; font-size:13px;}
    .tb-chip{font-size:11px; padding:5px 9px;}
  }

  /* ================= 扩展：引擎切换 ================= */
  .engines{display:flex; gap:2px; justify-content:flex-end; max-width:520px; margin:-10px auto 4px; padding-right:4px;}
  .eng-btn{border:none; background:none; color:var(--muted); font-size:11.5px; cursor:pointer;
           padding:3px 8px; border-radius:7px;}
  .eng-btn:hover{color:var(--ink2);}
  .eng-btn.on{color:#fff; background:linear-gradient(135deg,#8a5cff,#5b8cff);}
  @media (max-width:600px){ .engines{max-width:100%;} }

  /* ================= 扩展：随手记 ================= */
  .todo-fab{position:fixed; left:20px; bottom:20px; z-index:60; width:46px; height:46px;
            border:none; border-radius:50%; cursor:pointer; font-size:20px;
            display:grid; place-items:center; color:#fff;
            background:linear-gradient(135deg,#ffb347,#ff8a3d);
            box-shadow:0 10px 22px rgba(255,150,60,.35); transition:transform .2s ease;}
  .todo-fab:hover{transform:scale(1.08);}
  .todo-panel{position:fixed; left:76px; bottom:20px; z-index:70; width:min(300px, calc(100vw - 96px));
              background:var(--field-bg); color:var(--field-ink); border:1px solid var(--line);
              border-radius:16px; box-shadow:0 18px 48px rgba(20,10,50,.25);
              padding:12px; display:none; backdrop-filter:blur(10px);}
  .todo-panel.open{display:block; animation:rise .18s ease;}
  .todo-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .todo-head b{font-size:13.5px;}
  .todo-x{border:none; background:none; color:var(--field-ink); opacity:.5; cursor:pointer; font-size:14px;}
  .todo-add{display:flex; gap:6px; margin-bottom:8px;}
  .todo-add input{flex:1; min-width:0; padding:7px 10px; border:1px solid var(--field-line);
                  border-radius:9px; font-size:13px; outline:none; background:var(--field-bg); color:var(--field-ink);}
  .todo-add input:focus{border-color:rgba(150,110,255,.55);}
  .todo-add button{border:none; background:linear-gradient(135deg,#43e97b,#38c8a8); color:#fff;
                   width:30px; border-radius:9px; cursor:pointer; font-size:15px; flex:0 0 auto;}
  .todo-list{list-style:none; margin:0; padding:0; max-height:42vh; overflow-y:auto;}
  .todo-list li{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:13.5px;
                border-bottom:1px dashed var(--field-line);}
  .todo-list li:last-child{border-bottom:none;}
  .todo-list li.done span{text-decoration:line-through; opacity:.5;}
  .todo-list input[type="checkbox"]{flex:0 0 auto; width:16px; height:16px; accent-color:#38c8a8;}
  .todo-list span{flex:1; min-width:0; word-break:break-word;}
  .todo-list button{border:none; background:none; cursor:pointer; color:var(--muted); flex:0 0 auto;}
  @media (max-width:640px){
    .todo-fab{left:12px; bottom:12px; width:42px; height:42px; font-size:18px;}
    .todo-panel{left:60px; bottom:12px;}
  }
</style>
<style>
  /* ================= 管理后台(齿轮按钮/口令/抽屉) ================= */
  .gear{position:fixed; right:20px; bottom:20px; z-index:60; width:50px; height:50px;
        border:none; border-radius:50%; cursor:pointer; color:#fff; font-size:22px;
        display:grid; place-items:center; background:linear-gradient(135deg,#ff6a88,#8a5cff);
        box-shadow:0 10px 22px rgba(150,90,255,.35); transition:transform .25s ease;}
  .gear:hover{transform:rotate(60deg) scale(1.06);}
  .gear.off{display:none;}

  .pw-mask{position:fixed; inset:0; z-index:75; display:none; align-items:center;
           justify-content:center; background:rgba(25,15,50,.45);}
  .pw-card{width:min(330px,88vw); background:#fff; border-radius:18px; padding:22px;
           box-shadow:0 20px 60px rgba(0,0,0,.25); text-align:center;}
  .pw-card h3{margin:0 0 6px; font-size:17px;}
  .pw-card p{margin:0 0 14px; color:#8a819f; font-size:12.5px;}
  .pw-card input{width:100%; padding:10px 12px; border:1px solid #e2dcf0;
                 border-radius:10px; font-size:15px; outline:none; box-sizing:border-box;}
  .pw-err{color:#e5484d; font-size:12.5px; min-height:18px; margin-top:6px;}
  .pw-btns{display:flex; gap:10px; margin-top:8px;}
  .pw-btns button{flex:1; padding:9px 0; border:none; border-radius:10px; cursor:pointer;
                  font-size:14px; font-weight:600;}
  .pw-go{background:linear-gradient(135deg,#ff6a88,#8a5cff); color:#fff;}
  .pw-cancel{background:#f1eef8; color:#5b5470;}

  .adm-wrap{position:fixed; inset:0; z-index:65; display:none; pointer-events:none;}
  .adm-wrap.on{display:block;}
  .adm{pointer-events:auto; position:absolute; top:0; right:0; height:100%;
       width:min(720px,96vw); background:#fff; overflow:hidden; padding:18px 18px 0;
       box-shadow:-10px 0 40px rgba(60,30,110,.16); box-sizing:border-box;
       display:flex; flex-direction:column; animation:slideIn .22s ease;}
  .adm-head,.adm-tip,.adm-sec,.adm-row,.adm-btns{flex:0 0 auto;}
  #fEntries{flex:1 1 auto; min-height:140px; overflow-y:auto; overflow-x:hidden;
            padding:2px 8px 10px 0; margin-top:2px;}
  #fEntries::-webkit-scrollbar{width:8px;}
  #fEntries::-webkit-scrollbar-thumb{background:#e3daf5; border-radius:8px;}
  #fEntries::-webkit-scrollbar-thumb:hover{background:#cbbcf0;}
  #fEntries::-webkit-scrollbar-track{background:transparent;}
  @keyframes slideIn{from{transform:translateX(36px); opacity:0;} to{transform:none; opacity:1;}}
  .adm-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .adm-head b{font-size:18px;}
  .adm-x{border:none; background:#f1eef8; color:#6a6286; width:32px; height:32px;
         border-radius:10px; cursor:pointer; font-size:14px;}
  .adm-tip{color:#8a819f; font-size:12.5px; line-height:1.6; margin:0 0 10px;
           background:#faf8ff; border:1px dashed #e3daf5; padding:8px 12px; border-radius:10px;}
  .adm-note{border-radius:10px; padding:8px 11px; font-size:12.5px; line-height:1.6; margin:0 0 14px;}
  .adm-note.src-remote{background:#eef9f0; color:#1f7a43; border:1px solid #cdeeda;}
  .adm-note.src-local{background:#fff7e6; color:#9a6700; border:1px solid #f5e0b5;}
  .adm-note.src-embedded{background:#f4f4f8; color:#6a6286; border:1px solid #e6e6ee;}
  .adm-note b{font-weight:700;}
  .adm-sec{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
           color:#6a4fd8; margin:18px 0 8px;}
  .adm-sec::after{content:""; flex:1; height:1px; background:#efeafc;}
  .adm-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .adm-row label{flex:0 0 66px; font-size:13px; color:#555; font-weight:600;}
  .adm-row input{flex:1; min-width:0; padding:8px 10px; border:1px solid #e2dcf0;
                 border-radius:9px; font-size:14px; outline:none; box-sizing:border-box;}
  .adm-row input:focus{border-color:#a78bfa;}

  .ent{background:#faf9fd; border:1px solid #efe9fb; border-radius:12px; padding:10px; margin-bottom:10px;}
  .ent-l1{display:flex; align-items:center; gap:8px;}
  .ent-no{flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:#efe8ff;
          color:#7c5cff; font-size:11px; font-weight:700; display:grid; place-items:center;}
  .ent input,.ent select{border:1px solid #e6def4; border-radius:8px; padding:7px 8px;
                         font-size:13.5px; outline:none; background:#fff; color:#333;}
  .ent input:focus,.ent select:focus{border-color:#a78bfa;}
  .e-icon{flex:0 0 56px; height:34px; text-align:center; box-sizing:border-box;
          cursor:pointer; font-size:19px; line-height:1; padding:0;
          background:#fff; border:1px solid #e6def4; border-radius:8px;}
  .e-title{flex:1 1 90px; min-width:60px;}
  .e-type{flex:0 0 76px;}
  .e-color{flex:0 0 112px;}
  .ent-ops{display:flex; gap:4px;}

        return activeDoc.users[uid];
      }
      function saveNow() {   // 保存 = 加密当前成员内容，写回整份文档缓存
        collect();
        if (!curKey || !activeDoc || !activeDoc.users[uid]) { toast("会话异常，请刷新页面重新进入"); return; }
        reVaultWithCurrentKey(cfgOfCur()).then(function (enc) {
          if (cfgSrc === "embedded") cfgSrc = "local";
          activeDoc.siteName = cur.siteName;
          activeDoc.users[uid].enc = enc;
          docToLocal(activeDoc);
          needPublish = true;
          updateNote();
          toast(cfgSrc === "remote" || cfgSrc === "migrated"
            ? "已在本机加密备份。发布给别人：用「下载 config.json」替换仓库文件。"
            : "已加密保存到本机。");
        });
      }
      function configJSON() { return cfgOfCur(); }   // 明文内存对象（仅用于明文备份）
      function updateNote() {
        var el = $id("cfgNote");
        if (!el) return;
        var who = whoAmI();
        var whoHtml = "（<b>" + (who.emoji || "") + " " + (who.name || "成员") + "</b> 的空间）";
        if (cfgSrc === "remote") {
          el.className = "adm-note src-remote";
          el.innerHTML = needPublish
            ? "当前来自<b>线上 config.json</b> " + whoHtml + "，但本机有<b>未发布的修改</b>。点「📋 复制新配置」或「下载 config.json」替换仓库文件并提交，访客才看得到最新内容。"
            : "当前显示的是<b>线上 config.json</b> " + whoHtml + "（已加密）。改好后点「📋 复制新配置」/「下载 config.json」替换仓库文件并提交即可发布。";
        } else if (cfgSrc === "migrated") {
          el.className = "adm-note src-local";
          el.innerHTML = "数据已从<b>旧版明文</b>加密迁移到本机 " + whoHtml + "。请务必用「下载 config.json」<b>替换仓库里的 config.json</b>并提交；替换前他人仍可直接读到明文旧文件。";
        } else if (cfgSrc === "local") {
          el.className = "adm-note src-local";
          el.innerHTML = needPublish
            ? "当前显示<b>本机加密缓存</b> " + whoHtml + "（已修改未发布）。发布：点「下载 config.json」替换仓库文件并提交。"
            : "当前显示<b>本机加密缓存</b> " + whoHtml + "。发布给别人：点「下载 config.json」上传仓库替换并提交；其他成员与访客需各自口令才能查看。";
        } else {
          el.className = "adm-note src-embedded";
          el.innerHTML = "当前是<b>内置示例</b> " + whoHtml + "（加密兜底，仅供首次/离线体验）。正式使用：改好数据 → 「下载 config.json」上传仓库替换 → 建议在后台「修改口令/添加成员」整理成员。";
        }
      }

      $id("fSite").addEventListener("input", function () { cur.siteName = this.value; render(); });
      $id("fSlog").addEventListener("input", function () { cur.slogan   = this.value; render(); });
      $id("fFoot").addEventListener("input", function () { cur.footer   = this.value; render(); });
      $id("fCats").addEventListener("input", function () { cur.categories = parseCats(this.value); buildList(); render(); });
      $id("bChPwd").addEventListener("click", openCp);
      $id("cpNo").addEventListener("click", closeCp);
      $id("cpOk").addEventListener("click", doChangePwd);
      $id("cpNew1").addEventListener("keydown", function (ev) { if (ev.key === "Enter") $id("cpNew2").focus(); });
      $id("cpNew2").addEventListener("keydown", function (ev) { if (ev.key === "Enter") doChangePwd(); });
      $id("bBackup").addEventListener("click", exportPlainBackup);
      $id("bLock").addEventListener("click", function () {
        if (!confirm("退出登录并重新锁定本页？")) return;
        closeAdm(); clearKeys(); location.reload();
      });
      /* ---- 成员管理：添加 / 移除 / 切换 ---- */
      var nmMask = $id("nmMask");
      function openNm() {
        nmMask.style.display = "flex";
        $id("nmErr").textContent = "";
        ["nmName", "nmEmoji", "nmP1", "nmP2"].forEach(function (x) { $id(x).value = ""; });
        setTimeout(function () { $id("nmName").focus(); }, 30);
      }
      function closeNm() { nmMask.style.display = "none"; }
      function memberSkeleton() {
        return { slogan: "", footer: "", categories: ["常用"], theme: "auto", engine: "bing",
                 showClock: true, showQuote: true, showWeather: true, showTodo: true, entries: [] };
      }
      function doAddMember() {
        var nm = $id("nmName").value.trim(), em = $id("nmEmoji").value.trim(),
            p1 = $id("nmP1").value, p2 = $id("nmP2").value, err = $id("nmErr");
        if (!nm) { err.textContent = "请填写名字"; return; }
        if (p1.length < 6) { err.textContent = "口令至少 6 位"; return; }
        if (p1 !== p2) { err.textContent = "两次口令不一致"; return; }
        if (!activeDoc || !activeDoc.users[uid]) { err.textContent = "会话异常，请刷新重进"; return; }
        var ok = $id("nmOk"); ok.disabled = true;
        makeVault(memberSkeleton(), p1).then(function (enc) {
          activeDoc.siteName = cur.siteName;
          activeDoc.users.push({ name: nm, emoji: em || "👤", enc: enc });
          if (cfgSrc === "embedded") cfgSrc = "local";
          docToLocal(activeDoc);
          needPublish = true;
          closeNm(); ok.disabled = false;
          fillWho();
          updateNote();
          toast("已添加成员「" + nm + "」并加密保存。请用「下载 config.json」发布，对方才可登录");
        }).catch(function () { err.textContent = "加密失败，请重试"; ok.disabled = false; });
      }
      function doRemoveMember() {
        if (!activeDoc || activeDoc.users.length <= 1) { toast("至少保留一位成员"); return; }
        var who = whoAmI();
        if (!confirm("将移除成员「" + (who.name || "") + "」并删除其全部数据（不可恢复）。\n移除结果需要发布后才会对其他人生效。确定继续？")) return;
        var copy;
        try { copy = JSON.parse(JSON.stringify(activeDoc)); } catch (e) { return; }
        copy.users.splice(uid, 1);
        if (!copy.users.length) { toast("至少要保留一位成员"); return; }
        docToLocal(copy);
        needPublish = true;
        // 直接导出“移除后”的新版 config.json，方便立即发布
        var blob = new Blob([JSON.stringify(copy, null, 2)], { type: "application/json;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "config.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 200);
        toast("已生成移除成员后的 config.json，请上传替换仓库并提交，之后刷新即生效");
        clearKeys();
        setTimeout(function () { location.reload(); }, 1500);
      }
      function fillWho() {
        var who = whoAmI();
        var txt = (who.emoji || "") + " " + (who.name || "成员");
        var n = activeDoc && activeDoc.users ? activeDoc.users.length : 1;
        var chip = $id("whoChip");
        if (chip) chip.textContent = n + " 位成员 · " + txt;
        var old = $id("mWho");
        if (old) old.textContent = txt;
      }
      $id("mAdd").addEventListener("click", openNm);
      $id("nmNo").addEventListener("click", closeNm);
      $id("nmOk").addEventListener("click", doAddMember);
      $id("nmName").addEventListener("keydown", function (ev) { if (ev.key === "Enter") $id("nmEmoji").focus(); });
      $id("nmP2").addEventListener("keydown", function (ev) { if (ev.key === "Enter") doAddMember(); });
      $id("mDel").addEventListener("click", doRemoveMember);
      $id("mSwitch").addEventListener("click", function () {
        if (!confirm("切换成员将退出当前登录回到锁屏选择？")) return;
        closeAdm(); clearKeys(); location.reload();
      });
      nmMask.addEventListener("click", function (ev) { if (ev.target === nmMask) closeNm(); });
      fEntries.addEventListener("scroll", closePop);
      if (fSearchEl) fSearchEl.addEventListener("input", function () {
        searchKw = this.value;
        buildList();
      });

      fEntries.addEventListener("input", function (ev) {
        var t = ev.target;
        if (!t || !t.dataset || !t.dataset.k) return;
        var row = t.closest(".ent");
        if (!row) return;
        cur.entries[+row.dataset.idx][t.dataset.k] = t.value;
        render();
      });
      fEntries.addEventListener("change", function (ev) {
        var t = ev.target;
        if (!t || !t.dataset || !t.dataset.k) return;
        var row = t.closest(".ent");
        if (!row) return;
        cur.entries[+row.dataset.idx][t.dataset.k] = t.value;
        render();
      });
      fEntries.addEventListener("click", function (ev) {
        var rowEl = ev.target.closest ? ev.target.closest(".ent") : null;
        if (!rowEl) return;
        var i = +rowEl.dataset.idx;
        var opBtn = ev.target.closest ? ev.target.closest("button[data-op]") : null;
        if (opBtn) {
          if (opBtn.dataset.op === "up" && i > 0) {
            var t = cur.entries[i]; cur.entries[i] = cur.entries[i - 1]; cur.entries[i - 1] = t;
          } else if (opBtn.dataset.op === "down" && i < cur.entries.length - 1) {
            var u = cur.entries[i]; cur.entries[i] = cur.entries[i + 1]; cur.entries[i + 1] = u;
          } else if (opBtn.dataset.op === "del") {
            cur.entries.splice(i, 1);
          } else { return; }
          buildList(); render();
          return;
        }
        if (ev.target.classList && ev.target.classList.contains("e-icon")) {
          openPick(ev.target, i);
        }
      });

      $id("bAdd").addEventListener("click", function () {
        if (searchKw) { searchKw = ""; if (fSearchEl) fSearchEl.value = ""; } // 有搜索时先清空，保证新行可见
        cur.entries.push(norm(null));
        buildList(); render();
        var rows = fEntries.querySelectorAll(".ent");
        if (rows.length) {
          rows[rows.length - 1].querySelector(".e-title").focus();
          fEntries.scrollTop = fEntries.scrollHeight; // 滚到最底部，让新行可见
        }
      });
      $id("bSave").addEventListener("click", saveNow);
      $id("bReset").addEventListener("click", function () {
        if (!confirm("将清除本机加密缓存与登录钥匙并重新加载（线上内容不受影响）。确定？")) return;
        try { localStorage.removeItem(V_KEY); } catch (e) {}
        clearKeys();
        location.reload();
      });
      function copyText(t) {
        function ok() { toast("密文 config.json 已复制，去 GitHub 替换同名文件并提交即可发布"); }
        function legacy() {
          var ta = document.createElement("textarea");
          ta.value = t;
          ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); ok(); }
          catch (e) { toast("复制失败，请改用「下载 config.json」"); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(ok, legacy);
        } else legacy();
      }
      function vaultTextNow(cb) {   // 用当前内容+当前钥匙重加密当前成员，输出整份 v3 文档文本
        collect();
        if (!curKey || !activeDoc || !activeDoc.users[uid]) { toast("会话异常，请刷新重新输入口令"); return; }
        var copy;
        try { copy = JSON.parse(JSON.stringify(activeDoc)); } catch (e) { copy = { v: 3, siteName: cur.siteName || "", users: [] }; }
        copy.siteName = cur.siteName;
        reVaultWithCurrentKey(cfgOfCur()).then(function (enc) {
          copy.users[uid].enc = enc;
          docToLocal(copy);
          needPublish = false; updateNote();
          cb(JSON.stringify(copy, null, 2));
        });
      }
      $id("bCopy").addEventListener("click", function () {
        vaultTextNow(function (t) { copyText(t); });
      });
      $id("bExport").addEventListener("click", function () {
        vaultTextNow(function (t) {
          var blob = new Blob([t], { type: "application/json;charset=utf-8" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "config.json";
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 200);
          toast("已下载加密的 config.json，替换仓库同名文件即可");
        });
      });
      function downloadPlainBackup() {
        collect();
        var blob = new Blob([JSON.stringify(configJSON(), null, 2)], { type: "application/json;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "我的数据-明文备份.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 200);
        toast("已导出明文备份（含所有入口），请妥善保管");
      }
      function exportPlainBackup() {
        if (!confirm("明文备份包含全部站点数据、未加密。仅用于忘记口令时恢复，请存到安全位置。确定导出？")) return;
        downloadPlainBackup();
      }

      /* ---- 修改口令 / 弹层 ---- */
      var cpMask = $id("cpMask");
      function openCp() {
        cpMask.style.display = "flex";
        $id("cpErr").textContent = "";
        $id("cpNew1").value = ""; $id("cpNew2").value = "";
        setTimeout(function () { $id("cpNew1").focus(); }, 30);
      }
      function closeCp() { cpMask.style.display = "none"; }
      function doChangePwd() {
        var a = $id("cpNew1").value, b = $id("cpNew2").value, err = $id("cpErr");
        if (a.length < 6) { err.textContent = "口令至少 6 位"; return; }
        if (a !== b) { err.textContent = "两次输入不一致"; return; }
        if (!activeDoc || !activeDoc.users[uid]) { err.textContent = "会话异常，请刷新重进"; return; }
        var okBtn = $id("cpOk"); okBtn.disabled = true;
        makeVault(cfgOfCur(), a).then(function (enc) {
          activeSalt = b64ToU8(enc.salt);
          return deriveKey(a, activeSalt).then(function (k) {
            curKey = k;
            return rawOf(k).then(function (r) { curRawB64 = r; storeAuth(isRemembered(), uid, r); });
          }).then(function () {
            if (cfgSrc === "embedded") cfgSrc = "local";
            activeDoc.siteName = cur.siteName;
            activeDoc.users[uid].enc = enc;
            docToLocal(activeDoc);
            needPublish = true;
            closeCp(); okBtn.disabled = false;
            updateNote();
            toast("口令已更新！请用「下载 config.json」替换仓库旧文件，否则访客仍用旧口令");
          });
        }).catch(function () { err.textContent = "加密失败，请重试"; okBtn.disabled = false; });
      }

      $id("bImport").addEventListener("click", function () { $id("fFile").click(); });
      $id("fFile").addEventListener("change", function () {
        var file = this.files && this.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var o = JSON.parse(reader.result);
            var d = toDoc(o);
            if (d) {
              // 密文文档：优先用当前成员钥匙解当前位，若不符再试文件第一位成员
              var idx = (d.users[uid]) ? uid : 0;
              if (!curKey || !d.users[idx]) { alert("无法解密：当前没有可用钥匙或文件中没有成员"); return; }
              decryptMemberKey(d.users[idx], curKey).then(function (obj) {
                var nn = normalizeCfg(obj);
                var site = (cur.siteName || d.siteName || "");
                nn.siteName = site;
                assignCur(nn);
                cfgSrc = "local"; needPublish = true;
                fillForm(); render(); updateNote();
                toast("已导入加密内容到当前成员");
              }).catch(function () { alert("导入失败：口令不一致或文件已损坏"); });
              return;
            }
            var arr = Array.isArray(o) ? o : (o && Array.isArray(o.entries) ? o.entries : null);
            if (!arr) { alert("导入文件格式不对：应为加密 config.json，或含 entries 数组的明文配置"); return; }
            if (o && typeof o === "object" && !Array.isArray(o)) {
              if (typeof o.slogan === "string") cur.slogan = o.slogan;
              if (typeof o.footer === "string") cur.footer = o.footer;
              if (typeof o.siteName === "string") { cur.siteName = o.siteName; var s2 = $id("fSite"); if (s2) s2.value = o.siteName; }
            }
            cur.entries = arr.map(norm);
            cfgSrc = "local"; needPublish = true;
            fillForm(); render(); updateNote();
            toast("已导入明文内容。注意：请用「保存到本机」加密，或直接「下载 config.json」发布");
          } catch (e) { alert("导入失败：" + e.message); }
        };
        reader.readAsText(file);
        this.value = "";
      });

      /* ---- 打开/关闭后台（已解锁，无需再输口令） ---- */
      function openAdm() {
        admWrap.classList.add("on"); gear.classList.add("off");
        searchKw = ""; if (fSearchEl) fSearchEl.value = ""; // 重进后台时重置搜索
        fillForm();
        fillWho();
        updateNote();
      }
      function closeAdm() { admWrap.classList.remove("on"); gear.classList.remove("off"); }

      gear.addEventListener("click", function () {
        if (admWrap.classList.contains("on")) closeAdm(); else openAdm();
      });
      /* ---- 分区折叠 ---- */
      function accSwitch(acc, open) {
        if (open) {
          acc.classList.remove("fold");
          if (acc.querySelector("#fEntries")) acc.classList.add("acc-open");
        } else {
          acc.classList.remove("acc-open");
          acc.classList.add("fold");
        }
      }
      admWrap.addEventListener("click", function (ev) {
        var hd = ev.target.closest ? ev.target.closest(".acc-hd") : null;
        if (!hd) return;
        var acc = hd.parentNode;
        if (!acc || !acc.classList.contains("acc")) return;
        accSwitch(acc, acc.classList.contains("fold"));
        if (!acc.classList.contains("fold") && acc.querySelector("#fEntries")) {
          setTimeout(function () { fSearchEl && fSearchEl.focus(); }, 50);
        }
      });
      cpMask.addEventListener("click", function (ev) { if (ev.target === cpMask) closeCp(); });
      $id("admX").addEventListener("click", closeAdm);
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") { closePop(); closeAdm(); closeCp(); closeNm(); }
      });
      initLock();   // 启动锁屏与解密流程（此时所有监听均已就绪）
    })();
  </script>
</body>
</html>
